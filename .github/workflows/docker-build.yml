# 多架构构建并发布到 GitHub Container Registry (GHCR)
#
# 发布门禁：先在 amd64 上构建并验证入口脚本、ACME HTTP 路径和 DERP 端点；
# 全部通过后才构建并推送多架构镜像，避免坏镜像先覆盖 latest。

name: build-and-push

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
    inputs:
      derp_version:
        description: "tailscale.com module 版本（如 v1.102.2）；留空则使用上游最新稳定版"
        required: false
        type: string

env:
  IMAGE: ghcr.io/${{ github.repository }}
  PLATFORMS: linux/amd64,linux/arm64,linux/arm/v7

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Resolve Tailscale, revision, and Go versions
        id: ver
        env:
          REQUESTED_VERSION: ${{ inputs.derp_version }}
          GIT_TAG: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
        run: |
          set -euo pipefail

          if [ -n "$REQUESTED_VERSION" ]; then
            VERSION="$REQUESTED_VERSION"
          elif [ -n "$GIT_TAG" ]; then
            # v* 仓库标签与实际构建的 Tailscale module 版本保持一致。
            VERSION="$GIT_TAG"
          else
            VERSION=$(curl --fail --silent --show-error --retry 3 --connect-timeout 10 --max-time 30 \
              https://proxy.golang.org/tailscale.com/@latest | jq -er .Version)
          fi

          if ! [[ "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.]+)?$ ]]; then
            echo "无效的 tailscale.com 版本: $VERSION" >&2
            exit 1
          fi

          MOD_FILE=$(mktemp)
          INFO_FILE=$(mktemp)
          curl --fail --silent --show-error --retry 3 --connect-timeout 10 --max-time 30 \
            "https://proxy.golang.org/tailscale.com/@v/${VERSION}.mod" -o "$MOD_FILE"
          curl --fail --silent --show-error --retry 3 --connect-timeout 10 --max-time 30 \
            "https://proxy.golang.org/tailscale.com/@v/${VERSION}.info" -o "$INFO_FILE"

          GO_VERSION=$(perl -ne 'print "$1\n" and exit if /^go\s+(\S+)/' "$MOD_FILE")
          UPSTREAM_REVISION=$(jq -er '.Origin.Hash' "$INFO_FILE")

          if ! [[ "$GO_VERSION" =~ ^[0-9]+\.[0-9]+(\.[0-9]+)?$ ]]; then
            echo "无法从 tailscale.com@$VERSION 的 go.mod 解析 Go 版本" >&2
            exit 1
          fi
          if ! [[ "$UPSTREAM_REVISION" =~ ^[0-9a-f]{40}$ ]]; then
            echo "无法解析 Tailscale git revision" >&2
            exit 1
          fi

          docker buildx imagetools inspect "golang:${GO_VERSION}-alpine" >/dev/null

          {
            echo "derp_version=$VERSION"
            echo "go_version=$GO_VERSION"
            echo "upstream_revision=$UPSTREAM_REVISION"
          } >> "$GITHUB_OUTPUT"
          echo "Tailscale: $VERSION"
          echo "Revision:  $UPSTREAM_REVISION"
          echo "Go:        $GO_VERSION"

      - name: Compute publication tags and labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=ref,event=tag
            type=raw,value=latest,enable=${{ (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'schedule' }}
            type=raw,value=tailscale-${{ steps.ver.outputs.derp_version }}
            type=sha,prefix=sha-,format=short,enable=${{ github.event_name == 'push' }}
          labels: |
            org.opencontainers.image.description=Tailscale DERP server built from tailscale.com/cmd/derper@${{ steps.ver.outputs.derp_version }}
            io.github.neurocoda.derper.tailscale-version=${{ steps.ver.outputs.derp_version }}
            io.github.neurocoda.derper.tailscale-revision=${{ steps.ver.outputs.upstream_revision }}
            io.github.neurocoda.derper.go-version=${{ steps.ver.outputs.go_version }}

      # 发布前门禁：构建一个只存在于 runner 本地的 amd64 镜像。
      - name: Build validation image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          load: true
          push: false
          pull: true
          tags: derper:ci-test
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            DERP_VERSION=${{ steps.ver.outputs.derp_version }}
            GO_VERSION=${{ steps.ver.outputs.go_version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Validate CLI, ACME startup, persistence, and DERP endpoints
        run: |
          set -euo pipefail
          cleanup() {
            docker rm -f derper-smoke derper-acme-smoke >/dev/null 2>&1 || true
            rm -rf "$RUNNER_TEMP/derper-smoke"
          }
          trap cleanup EXIT
          mkdir -p "$RUNNER_TEMP/derper-smoke/certs" "$RUNNER_TEMP/derper-smoke/data"

          # 必填域名缺失时必须 fail-fast，不能静默使用 derp.tailscale.com。
          set +e
          docker run --rm derper:ci-test >"$RUNNER_TEMP/missing-host.log" 2>&1
          rc=$?
          set -e
          [ "$rc" -eq 64 ]
          grep -q DERP_HOSTNAME "$RUNNER_TEMP/missing-host.log"

          # 验证 Let's Encrypt 模式启动、HTTP-01 路径和持久化 DERP key。
          docker run -d --name derper-acme-smoke \
            -p 3080:80 -p 3443:443 -p 3479:3478/udp \
            -e DERP_HOSTNAME=derp.invalid \
            -e DERP_ACME_EMAIL=admin@example.com \
            -e DERP_VERIFY_CLIENTS=false \
            -v "$RUNNER_TEMP/derper-smoke/certs:/certs" \
            -v "$RUNNER_TEMP/derper-smoke/data:/var/lib/derper" \
            derper:ci-test

          for _ in $(seq 1 20); do
            code=$(curl --silent --max-time 2 -o /dev/null -w '%{http_code}' \
              http://localhost:3080/generate_204 || true)
            [ "$code" = "204" ] && break
            sleep 1
          done
          [ "$code" = "204" ] || { docker logs derper-acme-smoke; exit 1; }
          docker logs derper-acme-smoke 2>&1 | grep -q "Let's Encrypt 自动申请并续期"
          docker logs derper-acme-smoke 2>&1 | grep -q "STUN server listening"
          test -s "$RUNNER_TEMP/derper-smoke/data/derper.key"
          key_before=$(docker run --rm \
            -v "$RUNNER_TEMP/derper-smoke/data:/data:ro" \
            derper:ci-test sha256sum /data/derper.key | cut -d' ' -f1)
          docker rm -f derper-acme-smoke >/dev/null

          docker run -d --name derper-acme-smoke \
            -p 3080:80 -p 3443:443 -p 3479:3478/udp \
            -e DERP_HOSTNAME=derp.invalid \
            -e DERP_VERIFY_CLIENTS=false \
            -v "$RUNNER_TEMP/derper-smoke/certs:/certs" \
            -v "$RUNNER_TEMP/derper-smoke/data:/var/lib/derper" \
            derper:ci-test
          sleep 2
          key_after=$(docker run --rm \
            -v "$RUNNER_TEMP/derper-smoke/data:/data:ro" \
            derper:ci-test sha256sum /data/derper.key | cut -d' ' -f1)
          [ "$key_before" = "$key_after" ]
          docker rm -f derper-acme-smoke >/dev/null

          # 保持 derper 原生 --dev CLI 兼容，并验证协议端点。
          docker run -d --name derper-smoke -p 3340:3340 derper:ci-test --dev
          for _ in $(seq 1 20); do
            if curl --fail --silent --max-time 2 http://localhost:3340/ >/dev/null; then
              break
            fi
            sleep 1
          done
          curl --fail --silent --max-time 5 http://localhost:3340/ | grep -q DERP
          [ "$(curl --silent --max-time 5 -o /dev/null -w '%{http_code}' http://localhost:3340/derp)" = "426" ]
          [ "$(curl --silent --max-time 5 -o /dev/null -w '%{http_code}' http://localhost:3340/derp/probe)" = "200" ]

      # 只有前面的验证全部成功才登录并发布。
      - name: Login to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push multi-platform image
        if: github.event_name != 'pull_request'
        id: publish
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ env.PLATFORMS }}
          push: true
          pull: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            DERP_VERSION=${{ steps.ver.outputs.derp_version }}
            GO_VERSION=${{ steps.ver.outputs.go_version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verify published manifest
        if: github.event_name != 'pull_request'
        env:
          META_TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          set -euo pipefail
          IMG=$(printf '%s\n' "$META_TAGS" | head -1)
          docker buildx imagetools inspect "$IMG" --format '{{json .Manifest}}' > manifest.json
          jq -e '
            [.manifests[].platform |
              select(.os == "linux") |
              if .architecture == "arm" then "linux/arm/" + (.variant // "")
              else "linux/" + .architecture end] as $p |
            ($p | index("linux/amd64")) and
            ($p | index("linux/arm64")) and
            ($p | index("linux/arm/v7"))
          ' manifest.json >/dev/null
          echo "✓ published manifest contains amd64, arm64, and arm/v7"
